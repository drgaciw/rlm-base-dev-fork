name: PR Checks

on:
  pull_request:
    # Spelled out because the default set is `opened`, `synchronize`, `reopened` — and `edited`,
    # which fires when a pull request's *base branch* changes, is not in it. Retarget a green PR
    # from 264 to main and no event fires: the check run stays green on that head SHA, and the
    # merge base, the selection and both branch-scope verdicts are now all computed against a
    # base the gate never diffed. `ready_for_review` is belt-and-braces — a draft already fires
    # `opened`/`synchronize`, so a check run exists on the SHA before it is undrafted.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # A merge queue does not replay `pull_request`; a required check that has no `merge_group`
  # trigger is simply never reported, and the documented result is that the merge fails. No queue
  # is enabled today, so this is pre-emptive — and it is safe to wire now because `github.base_ref`
  # is empty for this event, which takes the same branch as a dispatch and selects `--all`.
  merge_group:
  # Nothing else. A required check is satisfied by the *most recent* check run bearing its name on
  # the head SHA — that is why "Re-run failed jobs" clears a red one — so any trigger that can run
  # this workflow on a PR's head SHA can publish `Mechanical checks` for it. `workflow_dispatch`
  # was here and did exactly that: dispatch on the PR's branch, `github.base_ref` is empty, the
  # selection widens to `--all`, the branch-scope step skips, and a green run supersedes the PR
  # run's red verdict — from the Actions UI, with write access rather than admin. `push:` would be
  # the same hole with no clicking at all. Manual runs are not worth that: the gate is a local
  # command (`python scripts/ai/pr_gate.py --all`), which is the documented primary path anyway.

permissions:
  contents: read
  # check_branch_scope.py calls `gh pr view` and `gh pr list`. `contents: read` alone leaves
  # every other scope at none, which happens to work while this repo is public and would stop
  # working the moment it is private or mirrored internally. That is necessary but not sufficient
  # for a private repo: git fetches are separate from GH_TOKEN and are not authenticated by it, so
  # see the --no-fetch note in the branch-scope step.
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Mechanical checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Merge-base selection needs real history: past a shallow boundary `git diff base...HEAD`
          # fails outright, and the gate turns a failed git into exit 2. (Not test_branch_scope.py,
          # which builds its own throwaway repos and passes in a --depth 1 clone.)
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # At or above the highest min_python in the check matrix, not the language feature any
          # one script needs: a check below its floor reports MISSING-DEP, and a missing dependency
          # fails the gate rather than skipping. tests/test_pr_gate.py asserts this version is
          # *at least* that floor (3.11 today) — deliberately an inequality, since pinning equality
          # would forbid testing on anything newer, but it does mean CI exercises only this one
          # version. A regression that only appears on the 3.11 floor is invisible here.
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            robot/requirements.txt

      - name: Resolve the base ref
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF:-}" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # checkout with fetch-depth: 0 already fetches every branch, so this is normally a
          # no-op verify. The fetch is the fallback rather than the default because
          # persist-credentials is false: an unconditional fetch works anonymously on a public
          # repo and would fail on a private one, which is a bad thing to depend on. Either
          # way the ref must exist before selection runs. Not because an unresolvable base
          # would pass quietly — this comment claimed that and it is wrong: `git diff` fails,
          # and the gate turns a failed git into exit 2, a tool error. It is pinned because a
          # red run on a base nobody can resolve costs a round trip to diagnose.
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null
          echo "ref=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"

      - name: Install only what the selection needs
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            SEL="--all"
          else
            SEL="--base ${BASE}"
          fi
          echo "SEL=${SEL}" >> "$GITHUB_ENV"
          reqs="$(python scripts/ai/pr_gate.py --requirements ${SEL})"
          if [ -n "${reqs}" ]; then
            python -m pip install --upgrade pip
            # Unquoted on purpose so each printed line becomes its own requirement spec, with
            # globbing off so a spec containing extras (`pkg[extra]`) cannot be eaten by
            # pathname expansion. --requirements emits `setuptools>=75.4,<77` ahead of the
            # CumulusCI pin itself (CumulusCI imports fs -> pkg_resources, absent from a 3.12+
            # venv), so this workflow never restates a pin and cannot drift from PINS.
            set -f
            python -m pip install ${reqs}
            set +f
          else
            echo "No extra dependencies needed."
          fi

      - name: Run the gate
        run: |
          set -euo pipefail
          python scripts/ai/pr_gate.py ${SEL}

      # Not part of the matrix on purpose: this one takes a PR number and talks to GitHub,
      # so it cannot be selected by path and cannot run in a hermetic local gate. The
      # workflow is the only place that has the number.
      - name: Branch scope
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          CROSS: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${CROSS}" = "true" ]; then
            # A fork's head is not in this checkout, and --pr refuses rather than compare
            # against the wrong commits — exit 2, a tool error. Left alone that would paint
            # every outside contributor's PR red for a condition they cannot fix, and would
            # show an environment problem as a code verdict, which this repo's exit contract
            # exists to prevent. So fetch the head and run the explicit form the checker's own
            # error message prescribes. Signal 2 (STACKED) needs --pr and is therefore
            # unavailable here; signal 1 still covers the branch.
            echo "Fork PR: comparing explicit refs; STACKED detection needs --pr and is off."
            git fetch --no-tags origin "pull/${PR}/head:pr-${PR}"
            set -- --base "origin/${BASE_REF}" --head "pr-${PR}"
          else
            set -- --pr "${PR}"
          fi
          # --no-fetch because the checker otherwise fetches `origin` itself, and with
          # persist-credentials: false that fetch is unauthenticated: it works anonymously on a
          # public repo and fails on a private or internally mirrored one — exactly the case the
          # permissions block above exists for, so leaving it in made that comment a half-truth.
          # Skipping it is safe *here* and nowhere else: the guard exists to stop a comparison
          # against a stale workstation clone, and checkout fetched full history seconds earlier in
          # this same job, which the base-ref step then verified. (The fork branch's own fetch is
          # still unauthenticated; that path is unexercised by a real fork PR and tracked as such.)
          set -- "$@" --no-fetch
          # The checker's exit contract is what makes this loop safe, and the reason it exists:
          # this step first went red on an HTTP 503 from GitHub's GraphQL API, correctly reported
          # as exit 2 — a tool error, which the contract says must never read as a verdict, yet a
          # red check reads as exactly that. So a 2 is retried and anything else is final. The
          # `-ne 2` line is load-bearing: widening it would make a real FOREIGN/STACKED finding
          # retryable, turning three attempts into three chances to miss it.
          #
          # What the loop does *not* buy, since this comment used to imply it: a step has no third
          # state. After three attempts it still exits 2 and the job is red, indistinguishable to
          # GitHub from a genuine finding. Retrying converts the transient case and only narrows the
          # window; a persistent tool error (a permissions denial, say) still reads as a verdict
          # after 45 seconds of sleeps. Expressing "advisory" would take `continue-on-error: true`,
          # which keeps the job green, or a separate check run with a `neutral` conclusion, which
          # needs `checks: write`. Neither is used, and tests/test_pr_gate.py forbids both — the
          # first because a green-on-error step cannot gate anything, the second because widening
          # `permissions` for a nicer status is a trade someone should have to argue for. So the
          # ambiguity is narrowed, not removed, and that is a decision rather than an oversight.
          attempt=1
          while :; do
            set +e
            python scripts/ai/check_branch_scope.py "$@"
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then exit "$code"; fi
            if [ "$attempt" -ge 3 ]; then
              echo "Branch scope could not run after ${attempt} attempts (last exit ${code})."
              exit 2
            fi
            echo "Tool error (exit ${code}); retrying attempt $((attempt + 1)) of 3."
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done

  # TP-05: the gate's stdlib tier on Windows. `gate` above runs on ubuntu only, so everything that
  # is specific to a native Windows checkout — junction/symlink repair, the hook launcher, cp1252
  # console output, `.cmd` shims, path separators — is exercised nowhere before merge. Each of those
  # has already regressed once and was found by hand on a developer's Windows machine.
  #
  # A separate job, not a `strategy.matrix` on `gate`: a matrix key would widen the primary gate's
  # pinned job keys, and `Mechanical checks` is the one name a branch ruleset matches. This job
  # publishes its own name and cannot satisfy that context. Requiring it is a repo-settings change
  # for the maintainer (Settings > Rules), not something a workflow file can do.
  #
  # Nothing is installed: `--tier stdlib` selects only checks that declare no package dependency, so
  # a green run also proves those suites need nothing beyond the interpreter. `--all` rather than
  # `--base`, because the point is to run the portable suites on every PR, not the ones a diff
  # selected. PYTHONUTF8 and PYTHONIOENCODING must stay unset — Python's default Windows encoding
  # is the locale's (cp1252), and forcing UTF-8 would hide exactly the bugs this leg exists to
  # find. The assert step fails the job if either is present, and tests/test_pr_gate.py fails the
  # workflow if any step or job sets one.
  #
  # Owner: whoever owns scripts/ai (agent-layer tooling). A flaky suite here is fixed or moved out
  # of the tier via `WINDOWS_WAIVERS` within 2 working days (test plan section 7); never retried.
  gate-windows:
    name: Mechanical checks (Windows stdlib)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The same version as `gate`, so the two legs differ by operating system only.
          python-version: "3.13"

      # A Windows checkout cannot create the repo's symlinked skill directories (`core.symlinks` is
      # off), so `.claude/skills/` and `.agents/skills/` arrive as stub files and `agent_tooling`
      # fails on "native skill links". CLAUDE.md documents this repair for developers; the step runs
      # it, which also exercises the junction code path on the OS where it matters. No admin rights.
      - name: Repair skill links
        run: python scripts/ai/link_skills.py --fix

      - name: Assert the locale encoding is in effect
        run: python -c "import locale, os, sys; assert 'PYTHONUTF8' not in os.environ and 'PYTHONIOENCODING' not in os.environ and not sys.flags.utf8_mode, 'UTF-8 mode is on, so this leg would not exercise the locale encoding'; print('utf8_mode', sys.flags.utf8_mode, 'locale', locale.getpreferredencoding(False))"

      - name: Run the stdlib gate
        run: python scripts/ai/pr_gate.py --all --tier stdlib

  # Diff-only lint: ruff (Python), ESLint (LWC JS) and prettier --check, each
  # scoped to files the PR actually touches. Independent of `gate` (no
  # `needs:`) so it runs in parallel — it is a code-quality signal, not part
  # of the mechanical-checks exit contract above. Intentionally does not run
  # under merge_group: ruleset config drift is exactly what `gate` and branch
  # protection are for, and this job needs github.event.pull_request.* to
  # scope to changed files.
  #
  # Not repo-wide on purpose: ESLint and Prettier already fail on main
  # (CONTRIBUTING.md — ESLint/Prettier baseline). A first PR-checks lint job
  # that only looks at changed files can go in today without a separate
  # repo-wide cleanup pass; ruff's baseline is pyproject.toml's
  # `[tool.ruff.lint.per-file-ignores]`, which does grandfather existing
  # violations, but new/changed lines in those files are still checked.
  lint:
    name: Lint (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json" # resolves engines.node (>=22)
          # setup-node's npm cache keys off the committed package-lock.json,
          # and `npm ci` below installs exactly that lockfile.
          cache: "npm"

      - name: List changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --diff-filter=ACMR: added/copied/modified/renamed only — a deleted
          # file can't be linted, and a rename with no content change would
          # otherwise be flagged over nothing.
          git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${HEAD_SHA}" > changed_files.txt
          py_files=$(grep -E '\.py$' changed_files.txt || true)
          js_files=$(grep -E '^(force-app|unpackaged)/.*/lwc/.*\.js$' changed_files.txt || true)
          # Apex (.cls/.trigger) is deliberately excluded here: prettier --check
          # has no "changed lines only" mode, so it fails on the *entire* file's
          # formatting, not just the diff — unlike ruff's per-file-ignores
          # grandfather clause. A one-line touch to a legacy, never-reformatted
          # Apex class would fail this job for pre-existing formatting the PR
          # didn't introduce. `npm run prettier:verify` still covers Apex
          # repo-wide for anyone who wants to check it locally.
          prettier_files=$(grep -E '\.(cmp|component|css|html|js|json|page|yaml|yml)$' changed_files.txt || true)
          {
            echo "py_files<<PY_EOF"; echo "${py_files}"; echo "PY_EOF"
            echo "js_files<<JS_EOF"; echo "${js_files}"; echo "JS_EOF"
            echo "prettier_files<<PRETTIER_EOF"; echo "${prettier_files}"; echo "PRETTIER_EOF"
          } >> "$GITHUB_OUTPUT"

      # Workflow self-tests (TP-11, docs/references/test-plan-2026-09.md §4.6). These are steps of
      # this job rather than a new job on purpose: tests/test_pr_gate.py pins the set of check-run
      # names this workflow publishes, and a new job would rename what a branch ruleset can match.
      # Runs whenever a workflow, the zizmor config or baseline, or the baseline comparer changes;
      # a PR that touches none of them skips all four steps. Procedure, version bumps and
      # baseline upkeep: docs/guides/ci-runbook.md.
      - name: Detect workflow changes
        id: workflows
        run: |
          set -euo pipefail
          if grep -qE '^(\.github/workflows/.+\.ya?ml|\.zizmor\.yml|\.github/zizmor-baseline\.json|scripts/lint/finding_baseline\.py)$' changed_files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned, no `latest`, no `@main`: actionlint is a release tarball checked against the
      # sha256 from that release's checksums.txt; zizmor and the shellcheck that actionlint shells
      # out to are PyPI wheels at exact versions. shellcheck is pinned because ubuntu-latest ships
      # its own, which would let the findings change with the runner image and not with a commit.
      - name: Install actionlint, shellcheck and zizmor (pinned)
        if: steps.workflows.outputs.changed == 'true'
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_PY_VERSION: "0.11.0.1"
          ZIZMOR_VERSION: "1.30.1"
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  ${tarball}" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/bin" actionlint
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          python -m pip install "zizmor==${ZIZMOR_VERSION}" "shellcheck-py==${SHELLCHECK_PY_VERSION}"

      # shellcheck at warning severity: a warning or error in any workflow's `run:` fails the PR.
      # The info/style findings it would also print (SC2086 unquoted expansion, SC2016 single
      # quotes, SC2129 chained redirects) are deliberate in several scripts here and are not
      # baselined file by file, so they are cut by severity rather than by regex or path.
      - name: actionlint
        if: steps.workflows.outputs.changed == 'true'
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          actionlint -version
          shellcheck --version
          actionlint -color

      # --offline: the audits that need the GitHub API (known-vulnerable actions, impostor
      # commits) depend on live advisory data and the network, so they would make an unrelated PR
      # red for a reason no commit caused. Findings that predate this step are counted per
      # (rule, file, message) in .github/zizmor-baseline.json: a new finding of an already-listed rule
      # raises a count and fails, a fixed one only warns that the baseline can shrink. No line
      # numbers, so a parallel PR that shifts lines cannot make the baseline stale.
      - name: zizmor
        if: steps.workflows.outputs.changed == 'true'
        run: |
          set -euo pipefail
          zizmor --version
          zizmor --pedantic --offline --config .zizmor.yml --no-exit-codes --format json \
            .github/workflows/ > "${RUNNER_TEMP}/zizmor.json"
          python scripts/lint/finding_baseline.py --name zizmor-finding \
            --baseline .github/zizmor-baseline.json --format zizmor "${RUNNER_TEMP}/zizmor.json"

      - name: ruff
        if: steps.diff.outputs.py_files != ''
        env:
          PY_FILES: ${{ steps.diff.outputs.py_files }}
        run: |
          set -euo pipefail
          # Version matches .pre-commit-config.yaml's ruff-pre-commit rev, so a
          # local `pre-commit run ruff` and this CI step agree.
          python -m pip install --upgrade pip "ruff==0.16.7"
          # -d '\n': split only on newlines, not all whitespace, so a changed
          # file whose name contains a space (tracked examples exist under
          # postman/ and templates/profiles/) is passed as one argument
          # instead of being split into two bogus paths.
          echo "${PY_FILES}" | xargs -r -d '\n' python -m ruff check

      - name: npm ci
        if: steps.diff.outputs.js_files != '' || steps.diff.outputs.prettier_files != ''
        run: npm ci

      - name: eslint
        if: steps.diff.outputs.js_files != ''
        env:
          JS_FILES: ${{ steps.diff.outputs.js_files }}
        run: |
          set -euo pipefail
          echo "${JS_FILES}" | xargs -r -d '\n' npx eslint

      - name: prettier --check
        if: steps.diff.outputs.prettier_files != ''
        env:
          PRETTIER_FILES: ${{ steps.diff.outputs.prettier_files }}
        run: |
          set -euo pipefail
          echo "${PRETTIER_FILES}" | xargs -r -d '\n' npx prettier --check

      # ---- Apex static analysis (TP-06, docs/references/test-plan-2026-09.md §4.2) -------------
      # Runs only when a PR changes Apex. Salesforce Code Analyzer's PMD engine, Security and
      # ErrorProne tags, compared with the committed count baseline (config/code-analyzer-
      # baseline.json) by scripts/lint/finding_baseline.py: a new finding, or one more of an old one,
      # fails; a fixed one only warns. The scan covers ALL Apex, not just the changed files, so the
      # comparison is always against the whole baseline; a PR can only add findings by changing Apex.
      # No Apex test runs here — that needs an org (nightly job, TP-04).
      - name: Detect changed Apex
        id: apex
        run: |
          set -euo pipefail
          if grep -qE '\.(cls|trigger)$' changed_files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Salesforce Code Analyzer
        if: steps.apex.outputs.changed == 'true'
        env:
          # Exact pin. A new version can change rules and messages: bump it in its own PR and
          # regenerate config/code-analyzer-baseline.json (procedure: the "Apex findings vs
          # baseline" step below).
          CODE_ANALYZER_VERSION: "5.16.0"
        run: |
          set -euo pipefail
          # The sf CLI version is the repo-wide pin; Java comes from the runner image (17+ needed).
          sf_version="$(grep -E '^SF_CLI_VERSION=' config/tool-versions.env | cut -d= -f2)"
          npm install --global "@salesforce/cli@${sf_version}"
          sf plugins install "code-analyzer@${CODE_ANALYZER_VERSION}"
          sf --version
          sf plugins | grep -E 'code-analyzer'

      - name: Apex Security/ErrorProne findings
        if: steps.apex.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # code-analyzer.yml (repo root) limits PMD to .cls/.trigger. --workspace . with two target
          # directories = every Apex file in the repo. Exit code 1 only means "violations were
          # found" (the comparer below decides whether that matters); anything else is a real error.
          set +e
          sf code-analyzer run --workspace . --target force-app --target unpackaged \
            --rule-selector pmd:Security --rule-selector pmd:ErrorProne \
            --output-file code-analyzer-results.json
          code=$?
          set -e
          if [ ! -s code-analyzer-results.json ]; then
            echo "::error::Code Analyzer wrote no results (exit ${code})"
            exit 2
          fi

      - name: Upload Apex analysis results
        if: always() && steps.apex.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: code-analyzer-results
          path: code-analyzer-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Apex findings vs baseline
        if: steps.apex.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Blocking. Exit 1 = a finding the baseline does not allow (a new rule, file or message, or
          # one more of an old one); exit 2 = the analysis itself failed (e.g. an engine crashed),
          # which is never read as a clean run. Fixed findings only warn.
          #
          # To regenerate the baseline (Code Analyzer bump, or after fixing findings): download the
          # `code-analyzer-results` artifact of a green run of THIS job (Linux paths, so the file
          # matches what CI will compare) and run
          #   python scripts/lint/finding_baseline.py --format code-analyzer --name "Apex finding" \
          #     --baseline config/code-analyzer-baseline.json --write code-analyzer-results.json
          # `--write` keeps each entry's `reason`; give new entries one. A renamed or moved .cls
          # re-surfaces its entries as new findings — regenerate in the same PR.
          python scripts/lint/finding_baseline.py --format code-analyzer --name "Apex finding" \
            --baseline config/code-analyzer-baseline.json code-analyzer-results.json

  # config/tool-versions.env is the single source of truth for pinned tool
  # versions; docker/Dockerfile's ARG defaults are a plain-`docker build`
  # fallback that is kept in sync with it "by convention" (its own header
  # comment says so) rather than by any automated check. Nothing previously
  # caught the two drifting apart, so a local build could silently use a
  # different toolchain than CI/the published image.
  docker-versions:
    name: Docker ARG defaults match tool-versions.env
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare
        run: |
          set -euo pipefail
          fail=0
          while IFS='=' read -r key val; do
            [ -z "${key:-}" ] && continue
            arg_line="$(grep -E "^ARG ${key}=" docker/Dockerfile || true)"
            if [ -z "${arg_line}" ]; then
              continue  # not every pinned var has a matching Dockerfile ARG
            fi
            arg_val="${arg_line#ARG "${key}"=}"
            if [ "${arg_val}" != "${val}" ]; then
              echo "::error file=docker/Dockerfile::ARG ${key} default (${arg_val}) does not match config/tool-versions.env (${val})"
              fail=1
            fi
          done < <(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' config/tool-versions.env)
          exit "${fail}"

  # Owner: TP-07 (LWC Jest baseline; test plan docs/references/test-plan-2026-09.md 4.3).
  # The job always runs on a pull request so its check name is always published, but every
  # step after the diff is skipped unless the PR touches LWC sources, the jest/npm config or
  # the lockfile. `npm ci` (not `npm install`) — package-lock.json is committed for this job.
  lwc-tests:
    name: LWC Jest tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect LWC or jest changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" \
              | grep -E '^((force-app|unpackaged)/.*/lwc/|jest\.config\.js$|package(-lock)?\.json$|sfdx-project\.json$|\.github/workflows/pr-checks\.yml$)' \
              > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No LWC, jest or npm changes in this PR; skipping LWC Jest tests." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.diff.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json" # resolves engines.node (>=22)
          cache: "npm"

      - name: Install dependencies
        if: steps.diff.outputs.run == 'true'
        run: npm ci

      - name: Run LWC Jest tests with coverage
        if: steps.diff.outputs.run == 'true'
        run: npm run test:coverage

      - name: Upload coverage
        if: always() && steps.diff.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lwc-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
