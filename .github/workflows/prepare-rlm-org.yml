name: Prepare RLM Org

on:
  workflow_dispatch:
    inputs:
      org_alias:
        description: "Scratch org alias to create"
        required: false
        default: "test-org"
      scratch_config:
        description: "Scratch org config name from orgs/ (e.g. dev, ent-sb0)"
        required: false
        default: "dev"
      run_verify:
        description: "Run the nightly verification stages (agent permission sets, Apex tests, QB idempotency, Robot setup suites) after the build"
        type: boolean
        required: false
        default: true
      run_e2e:
        description: "Run the Robot e2e suites (reset_account, quote_to_order, setup_quote, order_from_quote) with one rerun of failed tests after the verification stages"
        type: boolean
        required: false
        default: true
  # Nightly build + verify on the default branch (TP-04, docs/references/test-plan-2026-09.md
  # section 4.8). Schedules only fire from the default branch, and the devhub environment
  # must allow that as a deployment source (Settings -> Environments -> devhub).
  schedule:
    - cron: "0 3 * * 1-5"
  # Label-triggered CI for same-repo PR branches: apply the "ci:prepare-org"
  # label to a PR to kick off a full prepare_rlm_org build against the PR's
  # merge ref. The label is auto-removed at the start of the run, so
  # re-applying it re-triggers the build. (Fork PRs are skipped — they have
  # no access to the SFDX_AUTH_URL secret.)
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

# Serialize runs that target the same scratch-org alias: per-PR for
# label-triggered runs, per-ref for workflow_dispatch, one shared group for the
# nightly schedule. Prevents two jobs from
# concurrently creating/deleting the same org alias (flaky failures / leaked
# scratch orgs). cancel-in-progress is false so an in-flight build finishes
# (and tears down its org) before the next queued run starts.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'prepare-rlm-org-nightly' || format('prepare-rlm-org-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare-rlm-org:
    # Run on manual dispatch, on the weekday nightly schedule, or when the
    # trigger label is applied to a same-repo PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'ci:prepare-org' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Gates access to SFDX_AUTH_URL (a live Dev Hub credential) behind a
    # protected GitHub environment. This workflow alone cannot enforce
    # required reviewers or a deployment branch policy — that must be
    # configured once in the repo's Settings → Environments → devhub.
    environment: devhub
    env:
      # Dispatch uses the provided inputs; the nightly uses a fixed alias;
      # label-triggered PR runs derive a per-PR alias and default to the `dev`
      # scratch config.
      ORG_ALIAS: ${{ inputs.org_alias || (github.event_name == 'schedule' && 'ci-nightly') || format('pr{0}-ci', github.event.pull_request.number) }}
      SCRATCH_CONFIG: ${{ inputs.scratch_config || 'dev' }}
      # The npm-installed CLI writes "Warning: @salesforce/cli update available" to
      # *stderr* on every invocation. That is not merely noise: a task that reports a
      # failure from stderr can end up printing the notice where the cause should be,
      # which is how the #264-59 `sf agent activate` failure arrived with no
      # diagnosable message at all. Job-scoped so it also applies during the build.
      SF_SKIP_NEW_VERSION_CHECK: "true"
    steps:
      - name: Remove trigger label (re-apply to re-run)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "ci:prepare-org" || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up toolchain
        # Python + CumulusCI + Robot and the locked sf CLI / SFDMU install, all versions from
        # config/tool-versions.env: .github/actions/setup-toolchain.
        uses: ./.github/actions/setup-toolchain
        with:
          python: "true"
          cci: "true"
          robot: "true"
          sf: "true"
          sfdmu: "true"

      - name: Verify environment
        run: |
          node --version
          sf --version
          cci version
          sf plugins
          python --version
          python -c "import robot; print('Robot Framework OK')"
          python -c "import SeleniumLibrary; print('SeleniumLibrary OK')"
          python -c "import webdriver_manager; print('webdriver-manager OK')"
          cci task run validate_setup

      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          printf '%s' "$SFDX_AUTH_URL" > /tmp/sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth-url.txt --set-default-dev-hub --alias devhub
          rm /tmp/sfdx-auth-url.txt

      # SF_TEMP_SHOW_SECRETS is scoped to ONLY the steps where CumulusCI reads a
      # scratch-org access token via `sf org display --json`. The May 2026 CLI
      # change (forcedotcom/cli#3560) redacts tokens, so CCI reads "[REDACTED]"
      # and fails with INVALID_AUTH_HEADER on scratch creation / org info / the
      # flow's REST calls. Temporary shim (Salesforce removes it in Summer '26
      # once CCI uses `sf org auth show-access-token`); kept OFF the checkout /
      # build / setup steps so a token can't leak from unrelated JSON. Mirrors `.envrc`.
      - name: Create scratch org
        env:
          SF_TEMP_SHOW_SECRETS: "true"
        run: |
          cci org scratch "$SCRATCH_CONFIG" "$ORG_ALIAS" --default --days 1

      - name: Run prepare_rlm_org
        env:
          SF_TEMP_SHOW_SECRETS: "true" # CCI reads the scratch token for REST throughout the flow
        run: |
          cci flow run prepare_rlm_org --org "$ORG_ALIAS"

      # ---- Verify stage (TP-04): nightly + label-triggered + dispatch (run_verify) ----
      # Each stage is its own step with continue-on-error so one failing stage does
      # not hide the others; the "Verification summary" step fails the job if any
      # stage failed. The stages are the CCI flows defined in cumulusci.yml and are
      # chained by `ci_nightly_verify` for a single local command. The org is
      # deleted by the always() step below regardless of the outcome.
      - name: Verify agent permission-set grants
        id: verify_agent_permsets
        if: github.event_name != 'workflow_dispatch' || inputs.run_verify
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true" # CCI reads the scratch token for the Apex REST call
        run: |
          cci flow run ci_verify_agent_permsets --org "$ORG_ALIAS"

      - name: Verify Apex tests
        id: verify_apex
        if: github.event_name != 'workflow_dispatch' || inputs.run_verify
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true"
        run: |
          mkdir -p test-results/apex
          cci flow run ci_verify_apex --org "$ORG_ALIAS"

      - name: Verify QB data idempotency
        id: verify_idempotency
        if: github.event_name != 'workflow_dispatch' || inputs.run_verify
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true"
        run: |
          cci flow run run_qb_idempotency_tests --org "$ORG_ALIAS"
          # Wave-1 SFDMU redaction, integration level: no access token may have been
          # written into any dataset file by the loads above.
          if grep -rIl "accessToken" datasets/ 2>/dev/null; then
            echo "::error::accessToken found in datasets/ after the idempotency run"
            exit 1
          fi

      - name: Verify Robot setup suites
        id: verify_robot
        if: github.event_name != 'workflow_dispatch' || inputs.run_verify
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true" # the suites open an authenticated browser session via sf org open
        run: |
          # prepare_rlm_org ran the same wrappers into robot/rlm-base/results; the verify
          # flow writes one directory per suite under results/verify/, cleared here so
          # nothing stale can be mistaken for this stage's output.
          rm -rf robot/rlm-base/results/verify
          cci flow run ci_verify_robot_setup --org "$ORG_ALIAS"

      # ---- Robot e2e stage (TP-08): nightly + label-triggered + dispatch (run_e2e) ----
      # Behavioral UI suites, run headless after the setup-suite verification. Failed tests
      # are re-run exactly ONCE (tasks/rlm_robot_e2e.py rerun_failed -> robot --rerunfailed +
      # rebot --merge); a pass-after-rerun is FLAKY, never green (test plan section 7.3).
      # Everything lands under robot/rlm-base/results/e2e/ (blocking) and
      # results/e2e-quarantine/ (non-blocking), never in results/verify/, so the two
      # stage summaries and artifacts cannot mix. reset_account runs before each behavioral
      # suite so every suite starts from clean transactional data.
      - name: Run Robot e2e suites
        id: e2e_robot
        if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true" # the suites open an authenticated browser session via sf org open
        run: |
          rm -rf robot/rlm-base/results/e2e
          # The robot_* tasks reject --org (issue #320); the scratch org created above is
          # the CCI default, so select it explicitly and run without --org.
          cci org default "$ORG_ALIAS"
          status=0
          run_suite() {  # <n> <task>
            cci task run "$2" \
              -o outputdir "robot/rlm-base/results/e2e/$1-$2" \
              -o headed false -o rerun_failed true -o exclude_tags flaky || status=1
          }
          run_suite 1 robot_reset_account
          run_suite 2 robot_e2e
          run_suite 3 robot_reset_account
          run_suite 4 robot_setup_quote
          run_suite 5 robot_reset_account
          run_suite 6 robot_order_from_quote
          exit "$status"

      # Quarantined tests (tag `flaky`, listed in robot/QUARANTINE.md) keep running, but
      # here, in a non-blocking step: a failure is reported in the summary, never fails the job.
      - name: Run Robot e2e quarantine (non-blocking)
        id: e2e_quarantine
        if: (github.event_name != 'workflow_dispatch' || inputs.run_e2e) && always()
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true"
        run: |
          rm -rf robot/rlm-base/results/e2e-quarantine
          if ! grep -rqiE '^[[:space:]]+\[Tags\].*[[:space:]]flaky([[:space:]]|$)' robot/rlm-base/tests/e2e; then
            echo "No quarantined (flaky-tagged) e2e tests."
            exit 0
          fi
          cci org default "$ORG_ALIAS"
          cci task run robot_e2e \
            -o suite robot/rlm-base/tests/e2e \
            -o outputdir robot/rlm-base/results/e2e-quarantine \
            -o headed false -o rerun_failed true -o include_tags flaky

      - name: Upload Robot e2e artifacts
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_e2e)
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ env.ORG_ALIAS }}-${{ github.run_id }}
          path: |
            robot/rlm-base/results/e2e/
            robot/rlm-base/results/e2e-quarantine/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verification artifacts
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_verify)
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ env.ORG_ALIAS }}-${{ github.run_id }}
          path: |
            test-results/
            robot/rlm-base/results/verify/
          if-no-files-found: warn
          retention-days: 14

      - name: Verification summary
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_verify)
        env:
          OUTCOME_AGENT_PERMSETS: ${{ steps.verify_agent_permsets.outcome }}
          OUTCOME_APEX: ${{ steps.verify_apex.outcome }}
          OUTCOME_IDEMPOTENCY: ${{ steps.verify_idempotency.outcome }}
          OUTCOME_ROBOT: ${{ steps.verify_robot.outcome }}
        run: |
          python scripts/ci/summary.py verify

      - name: Robot e2e summary
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_e2e)
        env:
          OUTCOME_E2E: ${{ steps.e2e_robot.outcome }}
          OUTCOME_QUARANTINE: ${{ steps.e2e_quarantine.outcome }}
        run: |
          python scripts/ci/summary.py e2e

      - name: Delete scratch org
        if: always()
        env:
          SF_TEMP_SHOW_SECRETS: "true" # CCI reads org info to delete the scratch
        run: |
          cci org scratch_delete "$ORG_ALIAS" || echo "::warning::Could not delete scratch org ${ORG_ALIAS} (it may never have been created); check the Dev Hub for a leaked org."
