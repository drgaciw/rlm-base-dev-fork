name: Prepare RLM Org

on:
  workflow_dispatch:
    inputs:
      org_alias:
        description: "Scratch org alias to create"
        required: false
        default: "test-org"
      scratch_config:
        description: "Scratch org config name from orgs/ (e.g. dev, ent-sb0)"
        required: false
        default: "dev"
      run_verify:
        description: "Run the nightly verification stages (agent permission sets, Apex tests, QB idempotency, Robot setup suites) after the build"
        type: boolean
        required: false
        default: true
      run_e2e:
        description: "Run the Robot e2e suites (reset_account, quote_to_order, setup_quote, order_from_quote) with one rerun of failed tests after the verification stages"
        type: boolean
        required: false
        default: true
  # Nightly build + verify on the default branch (TP-04, docs/references/test-plan-2026-09.md
  # section 4.8). Schedules only fire from the default branch, and the devhub environment
  # must allow that as a deployment source (Settings -> Environments -> devhub).
  schedule:
    - cron: "0 3 * * 1-5"
  # Label-triggered CI for same-repo PR branches: apply the "ci:prepare-org"
  # label to a PR to kick off a full prepare_rlm_org build against the PR's
  # merge ref. The label is auto-removed at the start of the run, so
  # re-applying it re-triggers the build. (Fork PRs are skipped — they have
  # no access to the SFDX_AUTH_URL secret.)
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

# Serialize runs that target the same scratch-org alias: per-PR for
# label-triggered runs, per-ref for workflow_dispatch, one shared group for the
# nightly schedule. Prevents two jobs from
# concurrently creating/deleting the same org alias (flaky failures / leaked
# scratch orgs). cancel-in-progress is false so an in-flight build finishes
# (and tears down its org) before the next queued run starts.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'prepare-rlm-org-nightly' || format('prepare-rlm-org-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare-rlm-org:
    # Run on manual dispatch, on the weekday nightly schedule, or when the
    # trigger label is applied to a same-repo PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'ci:prepare-org' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Gates access to SFDX_AUTH_URL (a live Dev Hub credential) behind a
    # protected GitHub environment. This workflow alone cannot enforce
    # required reviewers or a deployment branch policy — that must be
    # configured once in the repo's Settings → Environments → devhub.
    environment: devhub
    env:
      # Dispatch uses the provided inputs; the nightly uses a fixed alias;
      # label-triggered PR runs derive a per-PR alias and default to the `dev`
      # scratch config.
      ORG_ALIAS: ${{ inputs.org_alias || (github.event_name == 'schedule' && 'ci-nightly') || format('pr{0}-ci', github.event.pull_request.number) }}
      SCRATCH_CONFIG: ${{ inputs.scratch_config || 'dev' }}
      # The npm-installed CLI writes "Warning: @salesforce/cli update available" to
      # *stderr* on every invocation. That is not merely noise: a task that reports a
      # failure from stderr can end up printing the notice where the cause should be,
      # which is how the #264-59 `sf agent activate` failure arrived with no
      # diagnosable message at all. Job-scoped so it also applies during the build.
      SF_SKIP_NEW_VERSION_CHECK: "true"
    steps:
      - name: Remove trigger label (re-apply to re-run)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "ci:prepare-org" || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        # $GITHUB_ENV requires every non-blank line to be NAME=VALUE — a
        # straight `cat` of config/tool-versions.env fails on its first line
        # (a `#` comment), so comments/blanks are filtered out first.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' config/tool-versions.env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            config/tool-versions.env
            robot/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned to an exact 24.x minor (config/tool-versions.env). node-version
          # "24" floats to "latest 24.x", which moved 24.16.0 → 24.17.0; on 24.17.0
          # the npm-installed sf CLI exits 13 on `sf org login` ("Detected
          # unsettled top-level await" in the CLI entrypoint). 24.16.0 is the
          # last-known-good — Prepare RLM Org succeeded on it 2026-06-11 (run
          # 27314890121). Re-float once a newer 24.x or sf CLI release restores
          # compatibility (tracked alongside check-cci-token-fix.yml).
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm download cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-node24

      - name: Install sf CLI and SFDMU plugin
        run: |
          # Versions pinned in config/tool-versions.env. sf CLI: 2.147.7 (was
          # 2.127.2, pinned 2026-06) because the 264 build reaches
          # `prepare_agents` → `sf agent activate`, part of the authoring-bundle
          # path this release moved to; 2.127.2 predates that work and failed
          # there while 2.147.7 completes the same flow locally. Keep this
          # within one or two minors of what developers run, since the agent
          # commands are moving.
          npm install -g "@salesforce/cli@${SF_CLI_VERSION}"
          yes | sf plugins install "sfdmu@${SFDMU_VERSION}"
          sf --version
          sf plugins

      - name: Install CumulusCI and dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip "setuptools>=75.4,<77"
          .venv/bin/pip install "cumulusci==${CUMULUSCI_VERSION}"
          .venv/bin/pip install -r robot/requirements.txt
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
          .venv/bin/cci version

      # F2 guard (docs/references/test-plan-2026-09.md, TP-02). cumulusci==4.8.1 declares
      # `selenium<4` and `robotframework-seleniumlibrary<6`; robot/requirements.txt needs
      # selenium>=4.49 / SeleniumLibrary>=6.9. One resolve of both is ResolutionImpossible, so the
      # step above installs them in two pip calls and the *final environment* is what matters. A
      # "fix the pip warning" change that re-resolves them together would downgrade selenium to
      # 3.x and break every Robot suite while this job's other steps still passed. This step fails
      # on that, and on any pip-check finding beyond the two known CumulusCI conflicts.
      - name: Assert robot stack overrides CumulusCI selenium pin
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import re
          import subprocess
          import sys

          import selenium
          import SeleniumLibrary

          selenium_version = selenium.__version__
          selenium_library_version = SeleniumLibrary.__version__
          print(f"selenium {selenium_version}, SeleniumLibrary {selenium_library_version}")
          failures = []
          if selenium_version.split(".")[0] != "4":
              failures.append(f"selenium major must be 4, found {selenium_version} "
                              "(CumulusCI's selenium<4 pin won the resolve)")
          if tuple(int(part) for part in re.findall(r"\d+", selenium_library_version)[:3]) < (6, 9, 0):
              failures.append(f"SeleniumLibrary must be >= 6.9.0, found {selenium_library_version}")
          # The distribution metadata must agree with the imported modules, so a stale
          # or shadowed copy on sys.path cannot satisfy the import check alone.
          for dist, imported in (("selenium", selenium_version),
                                 ("robotframework-seleniumlibrary", selenium_library_version)):
              if md.version(dist) != imported:
                  failures.append(f"{dist} metadata {md.version(dist)} != imported {imported}")

          # The only conflicts pip check may report: the two CumulusCI 4.8.1 upper bounds the
          # robot stack deliberately overrides. Anything else is a real broken requirement.
          allowed = re.compile(
              r"^cumulusci \S+ has requirement (selenium|robotframework-seleniumlibrary)<\d[\d.]*, "
              r"but you have \1 \S+\.$")
          check = subprocess.run([sys.executable, "-m", "pip", "check"],
                                 capture_output=True, text=True, encoding="utf-8", check=False)
          print(f"pip check (exit {check.returncode}):")
          print(check.stdout.rstrip() or "(no output)")
          if check.returncode != 0:
              lines = [line.strip() for line in check.stdout.splitlines() if line.strip()]
              unexpected = [line for line in lines if not allowed.match(line)]
              if not lines:
                  failures.append(f"pip check exited {check.returncode} with no output: "
                                  f"{check.stderr!r}")
              elif unexpected:
                  failures.append("pip check reported conflicts beyond the allow-listed "
                                  "CumulusCI selenium pins:\n  " + "\n  ".join(unexpected))

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          if check.returncode == 0:
              print("::notice::CumulusCI no longer pins selenium<4 or SeleniumLibrary<6; "
                    "drop this allow-list and the requirements-file comments (F2 resolved)")
          print("robot stack OK: selenium 4.x and SeleniumLibrary >= 6.9 with only the known CumulusCI conflicts")
          PY

      - name: Verify environment
        run: |
          node --version
          sf --version
          cci version
          sf plugins
          python --version
          python -c "import robot; print('Robot Framework OK')"
          python -c "import SeleniumLibrary; print('SeleniumLibrary OK')"
          python -c "import webdriver_manager; print('webdriver-manager OK')"
          cci task run validate_setup

      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          printf '%s' "$SFDX_AUTH_URL" > /tmp/sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth-url.txt --set-default-dev-hub --alias devhub
          rm /tmp/sfdx-auth-url.txt

      # SF_TEMP_SHOW_SECRETS is scoped to ONLY the steps where CumulusCI reads a
      # scratch-org access token via `sf org display --json`. The May 2026 CLI
      # change (forcedotcom/cli#3560) redacts tokens, so CCI reads "[REDACTED]"
      # and fails with INVALID_AUTH_HEADER on scratch creation / org info / the
      # flow's REST calls. Temporary shim (Salesforce removes it in Summer '26
      # once CCI uses `sf org auth show-access-token`); kept OFF the checkout /
      # build / setup steps so a token can't leak from unrelated JSON. Mirrors `.envrc`.
      - name: Create scratch org
        env:
          SF_TEMP_SHOW_SECRETS: "true"
        run: |
          cci org scratch "$SCRATCH_CONFIG" "$ORG_ALIAS" --default --days 1

      - name: Run prepare_rlm_org
        env:
          SF_TEMP_SHOW_SECRETS: "true" # CCI reads the scratch token for REST throughout the flow
        run: |
          cci flow run prepare_rlm_org --org "$ORG_ALIAS"

      # ---- Verify stage (TP-04): nightly + label-triggered + dispatch (run_verify) ----
      # Each stage is its own step with continue-on-error so one failing stage does
      # not hide the others; the "Verification summary" step fails the job if any
      # stage failed. The stages are the CCI flows defined in cumulusci.yml and are
      # chained by `ci_nightly_verify` for a single local command. The org is
      # deleted by the always() step below regardless of the outcome.
      - name: Verify agent permission-set grants
        id: verify_agent_permsets
        if: github.event_name != 'workflow_dispatch' || inputs.run_verify
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true" # CCI reads the scratch token for the Apex REST call
        run: |
          cci flow run ci_verify_agent_permsets --org "$ORG_ALIAS"

      - name: Verify Apex tests
        id: verify_apex
        if: github.event_name != 'workflow_dispatch' || inputs.run_verify
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true"
        run: |
          mkdir -p test-results/apex
          cci flow run ci_verify_apex --org "$ORG_ALIAS"

      - name: Verify QB data idempotency
        id: verify_idempotency
        if: github.event_name != 'workflow_dispatch' || inputs.run_verify
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true"
        run: |
          cci flow run run_qb_idempotency_tests --org "$ORG_ALIAS"
          # Wave-1 SFDMU redaction, integration level: no access token may have been
          # written into any dataset file by the loads above.
          if grep -rIl "accessToken" datasets/ 2>/dev/null; then
            echo "::error::accessToken found in datasets/ after the idempotency run"
            exit 1
          fi

      - name: Verify Robot setup suites
        id: verify_robot
        if: github.event_name != 'workflow_dispatch' || inputs.run_verify
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true" # the suites open an authenticated browser session via sf org open
        run: |
          # prepare_rlm_org ran the same wrappers into robot/rlm-base/results; the verify
          # flow writes one directory per suite under results/verify/, cleared here so
          # nothing stale can be mistaken for this stage's output.
          rm -rf robot/rlm-base/results/verify
          cci flow run ci_verify_robot_setup --org "$ORG_ALIAS"

      # ---- Robot e2e stage (TP-08): nightly + label-triggered + dispatch (run_e2e) ----
      # Behavioral UI suites, run headless after the setup-suite verification. Failed tests
      # are re-run exactly ONCE (tasks/rlm_robot_e2e.py rerun_failed -> robot --rerunfailed +
      # rebot --merge); a pass-after-rerun is FLAKY, never green (test plan section 7.3).
      # Everything lands under robot/rlm-base/results/e2e/ (blocking) and
      # results/e2e-quarantine/ (non-blocking), never in results/verify/, so the two
      # stage summaries and artifacts cannot mix. reset_account runs before each behavioral
      # suite so every suite starts from clean transactional data.
      - name: Run Robot e2e suites
        id: e2e_robot
        if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true" # the suites open an authenticated browser session via sf org open
        run: |
          rm -rf robot/rlm-base/results/e2e
          # The robot_* tasks reject --org (issue #320); the scratch org created above is
          # the CCI default, so select it explicitly and run without --org.
          cci org default "$ORG_ALIAS"
          status=0
          run_suite() {  # <n> <task>
            cci task run "$2" \
              -o outputdir "robot/rlm-base/results/e2e/$1-$2" \
              -o headed false -o rerun_failed true -o exclude_tags flaky || status=1
          }
          run_suite 1 robot_reset_account
          run_suite 2 robot_e2e
          run_suite 3 robot_reset_account
          run_suite 4 robot_setup_quote
          run_suite 5 robot_reset_account
          run_suite 6 robot_order_from_quote
          exit "$status"

      # Quarantined tests (tag `flaky`, listed in robot/QUARANTINE.md) keep running, but
      # here, in a non-blocking step: a failure is reported in the summary, never fails the job.
      - name: Run Robot e2e quarantine (non-blocking)
        id: e2e_quarantine
        if: (github.event_name != 'workflow_dispatch' || inputs.run_e2e) && always()
        continue-on-error: true
        env:
          SF_TEMP_SHOW_SECRETS: "true"
        run: |
          rm -rf robot/rlm-base/results/e2e-quarantine
          if ! grep -rqiE '^[[:space:]]+\[Tags\].*[[:space:]]flaky([[:space:]]|$)' robot/rlm-base/tests/e2e; then
            echo "No quarantined (flaky-tagged) e2e tests."
            exit 0
          fi
          cci org default "$ORG_ALIAS"
          cci task run robot_e2e \
            -o suite robot/rlm-base/tests/e2e \
            -o outputdir robot/rlm-base/results/e2e-quarantine \
            -o headed false -o rerun_failed true -o include_tags flaky

      - name: Upload Robot e2e artifacts
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_e2e)
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ env.ORG_ALIAS }}-${{ github.run_id }}
          path: |
            robot/rlm-base/results/e2e/
            robot/rlm-base/results/e2e-quarantine/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verification artifacts
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_verify)
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ env.ORG_ALIAS }}-${{ github.run_id }}
          path: |
            test-results/
            robot/rlm-base/results/verify/
          if-no-files-found: warn
          retention-days: 14

      - name: Verification summary
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_verify)
        env:
          OUTCOME_AGENT_PERMSETS: ${{ steps.verify_agent_permsets.outcome }}
          OUTCOME_APEX: ${{ steps.verify_apex.outcome }}
          OUTCOME_IDEMPOTENCY: ${{ steps.verify_idempotency.outcome }}
          OUTCOME_ROBOT: ${{ steps.verify_robot.outcome }}
        run: |
          python - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET


          def junit_counts(path):
              total = failed = skipped = 0
              for case in ET.parse(path).getroot().iter("testcase"):
                  total += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed += 1
                  elif case.find("skipped") is not None:
                      skipped += 1
              return total, failed, skipped


          def robot_counts(path):
              stat = ET.parse(path).getroot().find("./statistics/total/stat")
              if stat is None:
                  return 0, 0, 0
              p, f, s = (int(stat.get(k, 0)) for k in ("pass", "fail", "skip"))
              return p + f + s, f, s


          lines = [
              "## Nightly verification",
              "",
              "| Stage | Outcome | Tests | Failed | Skipped |",
              "|---|---|---|---|---|",
          ]
          stages = [
              ("Agent permission-set grants", "OUTCOME_AGENT_PERMSETS", None),
              ("Apex tests", "OUTCOME_APEX", ("test-results/apex/*.xml", junit_counts)),
              ("QB data idempotency", "OUTCOME_IDEMPOTENCY", None),
              ("Robot setup suites", "OUTCOME_ROBOT", ("robot/rlm-base/results/verify/**/output.xml", robot_counts)),
          ]
          failed_stages = []
          for label, env, counter in stages:
              outcome = os.environ.get(env, "") or "skipped"
              if outcome != "success":
                  failed_stages.append(label)
              counts = ("-", "-", "-")
              if counter:
                  pattern, fn = counter
                  files = glob.glob(pattern, recursive=True)
                  if files:
                      total = failed = skipped = 0
                      for f in files:
                          t, fl, sk = fn(f)
                          total, failed, skipped = total + t, failed + fl, skipped + sk
                      counts = (total, failed, skipped)
              lines.append(f"| {label} | {outcome} | {counts[0]} | {counts[1]} | {counts[2]} |")
          lines += ["", "These stages do not retry. Robot e2e results, with pass-after-rerun reported as flaky, are in the separate e2e summary."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          if failed_stages:
              print("::error::Verification stage(s) not successful: " + ", ".join(failed_stages))
              raise SystemExit(1)
          PY

      - name: Robot e2e summary
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_e2e)
        env:
          OUTCOME_E2E: ${{ steps.e2e_robot.outcome }}
          OUTCOME_QUARANTINE: ${{ steps.e2e_quarantine.outcome }}
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          KEYS = ("pass", "flaky", "fail", "skip")


          def load(root):
              """{suite dir: summary or None} for every stage directory under root."""
              found = {}
              for d in sorted(glob.glob(root + "/*/")):
                  files = glob.glob(d + "**/e2e-summary.json", recursive=True)
                  found[os.path.basename(os.path.normpath(d))] = (
                      json.load(open(files[0], encoding="utf-8")) if files else None
                  )
              return found


          lines = ["## Robot e2e", ""]
          totals = dict.fromkeys(KEYS, 0)
          flaky, failed, missing = [], [], []
          blocking = load("robot/rlm-base/results/e2e")
          lines += ["| Suite | Pass | Flaky | Fail | Skip |", "|---|---|---|---|---|"]
          for name, summary in blocking.items():
              if summary is None:
                  missing.append(name)
                  lines.append(f"| {name} | - | - | - | did not complete |")
                  continue
              counts = summary["counts"]
              for k in KEYS:
                  totals[k] += counts[k]
              flaky += [t["name"] for t in summary["tests"] if t["result"] == "flaky"]
              failed += [t["name"] for t in summary["tests"] if t["result"] == "fail"]
              lines.append(f"| {name} | {counts['pass']} | {counts['flaky']} | {counts['fail']} | {counts['skip']} |")
          lines.append(f"| **total** | {totals['pass']} | {totals['flaky']} | {totals['fail']} | {totals['skip']} |")
          if flaky:
              lines += ["", "**Flaky (failed, then passed on the single rerun) - not green:**"]
              lines += [f"- `{n}`" for n in flaky]
              lines += ["", "Repeat offenders go in robot/QUARANTINE.md (owner, issue, expiry <= 14 days)."]
              for n in flaky:
                  print(f"::warning::Flaky e2e test (passed only after rerun): {n}")
          if failed:
              lines += ["", "**Failed after the rerun:**"] + [f"- `{n}`" for n in failed]

          quarantine = load("robot/rlm-base/results/e2e-quarantine")
          q = os.environ.get("OUTCOME_QUARANTINE", "") or "skipped"
          if quarantine:
              qt = dict.fromkeys(KEYS, 0)
              for summary in quarantine.values():
                  for k in KEYS:
                      qt[k] += (summary or {"counts": {}})["counts"].get(k, 0)
              lines += ["", f"Quarantine (non-blocking, step {q}): pass {qt['pass']}, flaky {qt['flaky']}, fail {qt['fail']}, skip {qt['skip']}."]
          else:
              lines += ["", f"Quarantine (non-blocking): no quarantined tests ran (step {q})."]

          outcome = os.environ.get("OUTCOME_E2E", "") or "skipped"
          lines += ["", f"e2e step outcome: {outcome}."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")

          problems = []
          if outcome != "success":
              problems.append(f"e2e step outcome was {outcome}")
          if not blocking:
              problems.append("no e2e results were produced")
          if missing:
              problems.append("suites without a summary: " + ", ".join(missing))
          if totals["fail"]:
              problems.append(f"{totals['fail']} test(s) failed after the rerun")
          if problems:
              print("::error::Robot e2e: " + "; ".join(problems))
              raise SystemExit(1)
          PY

      - name: Delete scratch org
        if: always()
        env:
          SF_TEMP_SHOW_SECRETS: "true" # CCI reads org info to delete the scratch
        run: |
          cci org scratch_delete "$ORG_ALIAS" || echo "::warning::Could not delete scratch org ${ORG_ALIAS} (it may never have been created); check the Dev Hub for a leaked org."
