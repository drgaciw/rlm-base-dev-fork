# Build and publish the rlm-base build-environment image to GitHub Container
# Registry (GHCR), so users can download it instead of building locally.
#
# Triggers (never on ordinary pushes/PRs):
#   • Manually:  Actions → "Publish build-environment image" → Run workflow
#   • On tag:    push a tag matching `image-v*` (e.g. `image-v262.0`)
#   • Weekly:    scheduled rebuild (cron below) — runs automatically and also
#                refreshes the `:latest` tag
#
# After a run, the image is at:
#   ghcr.io/<owner>/rlm-base:<tag>     e.g. ghcr.io/bgaldino/rlm-base:latest
# Make the package public (Packages → rlm-base → Settings) for unauthenticated
# `docker pull`, or have users `docker login ghcr.io` first.
name: Publish build-environment image

on:
  workflow_dispatch:
    inputs:
      tag:
        # No default: a manual dispatch must name its tag explicitly. A
        # "latest" default meant a dispatch against a feature branch — where
        # nobody thinks to override it — could still publish `:latest`. The
        # step below fails outright if `tag` resolves to `latest` off the
        # default branch, so this input can't slip past that guard either.
        description: "Image tag to publish (e.g. 262) — must not be 'latest' unless run from the default branch"
        required: true
      platforms:
        description: "Target platforms"
        required: true
        default: "linux/amd64,linux/arm64"
  push:
    tags:
      - "image-v*"
  schedule:
    # Weekly rebuild — Mondays 07:00 UTC — so the published image keeps current
    # with base-image security patches, the latest sf CLI / SFDMU, and main's
    # repo snapshot. Scheduled runs always build from the default branch (main).
    # Adjust the cron (UTC, 5-field) to change cadence. Note: GitHub disables
    # scheduled workflows after 60 days of repo inactivity.
    - cron: "0 7 * * 1"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        # $GITHUB_ENV requires every non-blank line to be NAME=VALUE — a
        # straight `cat` of config/tool-versions.env fails on its first line
        # (a `#` comment), so comments/blanks are filtered out first.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' config/tool-versions.env >> "$GITHUB_ENV"

      - name: Set image coordinates
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # lowercase for GHCR
          echo "image=ghcr.io/${owner}/rlm-base" >> "$GITHUB_OUTPUT"
          case "${EVENT_NAME}" in
            workflow_dispatch)
              tag="${INPUT_TAG}"
              # A manual dispatch can target any branch, but ":latest" must
              # only ever come from the default branch — otherwise a
              # feature-branch dispatch could overwrite the tag users pull by
              # default with unreleased/untested content.
              if [ "${tag}" = "latest" ] && [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
                echo "::error::Manual dispatch tag 'latest' is only allowed from the default branch (${DEFAULT_BRANCH}); current ref is ${GITHUB_REF_NAME}." >&2
                exit 1
              fi
              platforms="${INPUT_PLATFORMS}" ;;
            schedule)
              # Weekly run: date-stamped tag for history, plus :latest (added below).
              tag="$(date -u +%Y%m%d)"
              platforms="linux/amd64,linux/arm64" ;;
            *)  # tag push (image-v*)
              tag="${GITHUB_REF_NAME#image-v}"
              platforms="linux/amd64,linux/arm64" ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          image="ghcr.io/${owner}/rlm-base"
          # :latest only ever tracks the default branch: a workflow_dispatch run
          # against a feature branch, or a tag cut from one, must not overwrite
          # it. schedule always builds the default branch by definition.
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            tags="$(printf '%s\n%s' "${image}:${tag}" "${image}:latest")"
          else
            tags="${image}:${tag}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "${tags}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            CUMULUSCI_VERSION=${{ env.CUMULUSCI_VERSION }}
            SF_CLI_VERSION=${{ env.SF_CLI_VERSION }}
            SFDMU_VERSION=${{ env.SFDMU_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        # Read via `env:` instead of interpolating `${{ steps.meta.outputs.* }}`
        # straight into the `run:` script — that step's outputs are derived
        # from the workflow_dispatch `tag` input, and templating untrusted (or
        # merely unexpected) values directly into shell text is a script-
        # injection vector even though this input is admin-only today.
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "### Published \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "RLM_IMAGE=${IMAGE}:${TAG} ./docker/rlm pull" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
