# Repo-level Python tooling configuration.
#
# This file configures pytest discovery for the build harness unit tests and
# ruff for the CI lint job (.github/workflows/pr-checks.yml). The repo's
# primary build system is CumulusCI (cumulusci.yml), not Python packaging, so
# there is no [project] table here on purpose.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's own default select (E4 import, E7 statement, E9 syntax/runtime
# error, F pyflakes). Deliberately not widened here: this is a first-time
# baseline for a codebase that never ran a linter, not a style rewrite.
select = ["E4", "E7", "E9", "F"]
# PLW1514 (unspecified-encoding, I2) is a preview rule; `explicit-preview-rules`
# keeps preview enablement scoped to exactly the rules named in `extend-select`
# below, rather than turning on every other preview rule too.
preview = true
explicit-preview-rules = true
extend-select = ["PLW1514"]

[tool.ruff.lint.per-file-ignores]
# Grandfathered violations present when the lint job was added (2026-09-22).
# New code should not add to these; existing files are ignored per-code
# rather than fixed here because tasks/**, scripts/** and tests/** business
# logic belongs to other work packages. Narrow an entry (or drop it) the next
# time its file is touched.
"datasets/sfdmu/inapp/convert_from_legacy.py" = ["E731"]
"postman/utilities/build_agentforce_collection.py" = ["F401", "F541"]
